embedding:
  model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 256
  device: cuda
  normalize: true

hnsw:
  k: 40
  M: 32
  ef_construction: 250
  ef_search: 120
  min_similarity: 0.30
  num_threads: -1

leiden:
  resolution: 0.4
  resolution_multiplier: 1.6
  max_depth: 5
  min_cluster_size: 150
  min_child_size: 30
  n_iterations: 4
  seed: 42
