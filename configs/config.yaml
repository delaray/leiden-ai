embedding:
  model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 256
  device: cuda
  normalize: true

hnsw:
  k: 30
  M: 32
  ef_construction: 200
  ef_search: 100
  min_similarity: 0.25
  num_threads: -1

leiden:
  resolution: 0.5
  resolution_multiplier: 1.5
  max_depth: 5
  min_cluster_size: 50
  min_child_size: 10
  n_iterations: 4
  seed: 42
